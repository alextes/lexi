name: deploy

on:
  workflow_run:
    workflows:
      - check-lint-test
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.LEXI_HOST }}
          username: ${{ secrets.LEXI_USER }}
          key: ${{ secrets.LEXI_SSH_KEY }}
          script: |
            /home/ubuntu/lexi/scripts/deploy.sh
